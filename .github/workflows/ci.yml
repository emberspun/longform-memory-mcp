name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 18 is the floor declared in package.json engines — test the floor,
        # not just the latest, or the floor is a claim nobody checks.
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Includes a real stdio round-trip against the built binary.
      - run: npm test
      - run: npm run build

  # A published Docker image that does not build is worse than no image at all,
  # and the Dockerfile is the one artifact nothing else in CI exercises.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t longform-memory-mcp:ci .
      - name: Container answers a real MCP handshake
        run: |
          REQ='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}'
          OUT=$(printf '%s\n' "$REQ" | docker run -i --rm longform-memory-mcp:ci | head -1)
          echo "$OUT"
          # Assert on the negotiated result, not merely on non-empty output:
          # a container that dies instantly also produces "some" output.
          echo "$OUT" | grep -q '"serverInfo"' || { echo "::error::no initialize result from the container"; exit 1; }
